[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "soundpost"
version = "0.4.0"
description = "Survival-aware recurrence modelling from early-postoperative five-phase Gd-EOB-DTPA MRI of the remnant liver"
requires-python = ">=3.9,<3.10"
readme = { file = "README", content-type = "text/plain" }
license = { file = "LICENSE" }
authors = [{ name = "EARLST study group" }]
keywords = [
  "hepatocellular-carcinoma",
  "gadoxetic-acid",
  "hepatobiliary-phase",
  "survival-analysis",
  "discrete-time-hazard",
  "state-space-model",
]
dependencies = [
  "torch==1.13.1",
  "numpy==1.23.5",
  "scipy==1.9.3",
  "einops==0.6.1",
  "pydantic==2.4.2",
  "PyYAML==6.0.1",
  "click==8.1.7",
]

[project.optional-dependencies]
dev = [
  "pytest==7.4.2",
  "ruff==0.1.6",
  "black==23.11.0",
  "isort==5.12.0",
  "mypy==1.7.0",
  "pre-commit==3.5.0",
  "types-PyYAML==6.0.12.12",
]

[project.scripts]
soundpost = "soundpost.workshop.__main__:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py39"]

[tool.isort]
profile = "black"
line_length = 100
src_paths = ["src", "tests"]

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4"]
ignore = ["B905"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/soundpost"]
plugins = ["pydantic.mypy"]
disallow_subclassing_any = false
disallow_untyped_decorators = false
disable_error_code = ["no-any-return", "no-untyped-call", "type-arg"]

[[tool.mypy.overrides]]
module = ["scipy.*", "einops.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src", "."]
